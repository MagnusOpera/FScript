name: Publish Release Artifacts
run-name: Release ${{ inputs.release_tag }}

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing published release tag whose verified assets will be distributed
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published release tag to retry across package registries and the tap'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-publish-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  validate-published-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Read workspace tool versions
        id: tool-versions
        uses: ./.github/actions/workspace-versions
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tool-versions.outputs.node }}
      - name: Require an existing published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node .github/scripts/release-tag.mjs "$RELEASE_TAG" --github-output >> "$GITHUB_OUTPUT"
          draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$draft" != false ]]; then
            echo "::error::The release must already be published."
            exit 1
          fi

  release-nuget:
    needs: validate-published-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/{0}', inputs.release_tag) }}

      - name: Read workspace tool versions
        id: tool-versions
        uses: ./.github/actions/workspace-versions

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.tool-versions.outputs.dotnet_sdk }}

      - name: Download GitHub release artifacts
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ env.RELEASE_TAG }}
          fileName: '*.nupkg'

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # NuGet requires the policy creator's username, not the package owner.
          user: pct-magnusopera

      - name: Push packages to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          packages=(./*.nupkg)
          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "::error::Release has no NuGet package assets."
            exit 1
          fi
          for pkg in "${packages[@]}"; do
            dotnet nuget push "$pkg" --skip-duplicate --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          done

  release-npm:
    needs: validate-published-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate-published-release.outputs.version }}
      PACKAGE_NAME: '@magnusopera/fscript'
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/{0}', inputs.release_tag) }}

      - name: Read workspace tool versions
        id: tool-versions
        uses: ./.github/actions/workspace-versions

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tool-versions.outputs.node }}
          registry-url: 'https://registry.npmjs.org'

      - name: Download npm package artifact
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ env.RELEASE_TAG }}
          fileName: '*.tgz'

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::NPM_KEY secret is not configured."
            exit 1
          fi

          shopt -s nullglob
          packages=(./*.tgz)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one audited npm .tgz release asset, found ${#packages[@]}."
            exit 1
          fi

          if npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${RELEASE_VERSION} is already published; skipping."
            exit 0
          fi

          npm publish "${packages[0]}" --access public --provenance

  update-homebrew-tap:
    uses: ./.github/workflows/release-homebrew-tap.yml
    needs:
      - release-nuget
      - release-npm
    with:
      release_tag: ${{ inputs.release_tag }}
      dry-run: false
    secrets: inherit
