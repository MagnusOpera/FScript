name: 🦄 Update Homebrew Tap

permissions:
  contents: read

on:
  workflow_call:
    secrets:
      PAT_HOMEBREW_TAP:
        required: true
    inputs:
      release_tag:
        required: true
        description: Canonical release tag vX.Y.Z
        type: string
      dry-run:
        required: false
        default: true
        description: Whether to skip pushing the tap commit
        type: boolean
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        description: Canonical release tag vX.Y.Z
        type: string
      dry-run:
        required: false
        default: true
        description: Whether to skip pushing the tap commit
        type: boolean

env:
  FSCRIPT_TAG: ${{ inputs.release_tag }}
  FSCRIPT_FORMULA_FILE: fscript

jobs:
  update-homebrew-tap:
    environment: release
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    steps:
      - name: Require a prefixed stable release tag
        shell: bash
        run: |
          if [[ ! "$FSCRIPT_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a canonical release tag vX.Y.Z."
            exit 1
          fi
      - name: Checkout FScript repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ format('refs/tags/{0}', inputs.release_tag) }}
          path: fscript

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          repository: magnusopera/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.PAT_HOMEBREW_TAP }}

      - name: Update Homebrew formula
        env:
          FSCRIPT_GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./fscript/.github/scripts/generate-homebrew-tap \
            "${FSCRIPT_TAG}" \
            ./fscript/.github/scripts/fscript-formula-template.rb \
            > "./homebrew-tap/Formula/${FSCRIPT_FORMULA_FILE}.rb"

      - name: Commit updated tap
        working-directory: homebrew-tap
        run: |
          set -euo pipefail

          git config user.name magnusopera-bot
          git config user.email bot@magnusopera.io
          git add "Formula/${FSCRIPT_FORMULA_FILE}.rb"

          if git diff --cached --quiet; then
            echo "No tap changes to commit"
            exit 0
          fi

          git commit -m "Brew formula update for fscript version ${FSCRIPT_TAG}"

      - name: Push tap
        working-directory: homebrew-tap
        if: ${{ !inputs.dry-run }}
        run: |
          set -euo pipefail
          git push origin HEAD:main
