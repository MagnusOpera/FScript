name: 🌍 Publish Website
run-name: Publish Stable and Next documentation

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website build source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Read workspace tool versions
        id: tool-versions
        uses: ./.github/actions/workspace-versions

      - name: Read Next interpreter tool versions
        id: next-tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/website-next-tools"
          git show refs/remotes/origin/main:WORKSPACE > "$RUNNER_TEMP/website-next-tools/WORKSPACE"
          script="$PWD/.build/read-tool-versions.mjs"
          cd "$RUNNER_TEMP/website-next-tools"
          node "$script" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.next-tools.outputs.dotnet_sdk }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tool-versions.outputs.node }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: make website-install

      - name: Read published stable releases
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/website-releases.json`, JSON.stringify(releases));

      - name: Test website source assembly
        run: npm test --prefix website

      - name: Generate documentation and build website
        env:
          FSCRIPT_WEBSITE_RELEASES: ${{ runner.temp }}/website-releases.json
          FSCRIPT_WEBSITE_NEXT_REF: refs/remotes/origin/main
        run: make website-build

      - name: Verify build did not modify repository sources
        run: test -z "$(git status --porcelain)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
