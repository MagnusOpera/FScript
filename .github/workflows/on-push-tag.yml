name: 📦 Prepare Release
run-name: Prepare release ${{ github.ref_name }}

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

env:
  BUILD_VERSION: ${{ github.ref_name }}

jobs:
  release-ci:
    uses: ./.github/workflows/ci.yml
    with:
      suffix: release
      require-changelog: true
    permissions:
      contents: read
      checks: write
      packages: write
    secrets: inherit

  package-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read workspace tool versions
        id: tool-versions
        uses: ./.github/actions/workspace-versions

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.tool-versions.outputs.dotnet_sdk }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tool-versions.outputs.node }}

      - name: Install extension dependencies
        working-directory: vscode-fscript
        run: npm ci

      - name: Sync extension version to tag
        shell: bash
        working-directory: vscode-fscript
        run: |
          TAG_VERSION="${GITHUB_REF_NAME}"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version

      - name: Build and stage language server
        shell: bash
        run: |
          rm -rf vscode-fscript/server
          dotnet publish src/FScript.LanguageServer/FScript.LanguageServer.csproj -c Release -p:PublishAot=false -p:Version=${{ env.BUILD_VERSION }} -o vscode-fscript/server

      - name: Verify staged server assembly versions and SDK providers
        env:
          FSCRIPT_RELEASE_SERVER_DIR: ${{ github.workspace }}/vscode-fscript/server
          FSCRIPT_RELEASE_VERSION: ${{ env.BUILD_VERSION }}
        run: dotnet test tests/FScript.LanguageServer.Tests/FScript.LanguageServer.Tests.csproj -c Release --filter "FullyQualifiedName~ReleasePackagingTests|FullyQualifiedName~EnvironmentTests"

      - name: Install extension packaging tool
        env:
          VSCE_VERSION: ${{ steps.tool-versions.outputs.vsce }}
        run: npm install -g "@vscode/vsce@$VSCE_VERSION"

      - name: Package extension
        working-directory: vscode-fscript
        run: vsce package

      - name: Publish platform binaries and pack NuGet packages
        run: make publish publish-darwin publish-linux publish-windows pack-nuget config=Release version="$BUILD_VERSION"

      - name: Pack release archives
        run: |
          (cd .out/dotnet; zip "../fscript-${BUILD_VERSION}-dotnet.zip" ./*)
          (cd .out/windows/x64; zip "../../fscript-${BUILD_VERSION}-windows-x64.zip" ./*)
          (cd .out/windows/arm64; zip "../../fscript-${BUILD_VERSION}-windows-arm64.zip" ./*)
          (cd .out/linux/x64; zip "../../fscript-${BUILD_VERSION}-linux-x64.zip" ./*)
          (cd .out/linux/arm64; zip "../../fscript-${BUILD_VERSION}-linux-arm64.zip" ./*)
          cp entitlements.plist .out/darwin/entitlements.plist
          (cd .out/darwin; zip -r "../fscript-${BUILD_VERSION}-darwin-unsigned.zip" ./*)

      - name: Pack npm package
        shell: bash
        run: |
          dotnet tool restore
          cd src/FScript.JavaScript
          npm version "${BUILD_VERSION}" --no-git-tag-version --allow-same-version
          npm run build
          npm test
          npm pack --pack-destination ../../.out

      - name: Stage release assets
        run: |
          mkdir -p "${RUNNER_TEMP}/release-assets"
          cp .out/*.zip .out/*.nupkg .out/*.tgz vscode-fscript/*.vsix "${RUNNER_TEMP}/release-assets/"

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-packages
          path: |
            ${{ runner.temp }}/release-assets/*
            !${{ runner.temp }}/release-assets/*-darwin-unsigned.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Upload macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: ${{ runner.temp }}/release-assets/fscript-${{ env.BUILD_VERSION }}-darwin-unsigned.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  verify-macos-artifact:
    needs: package-release
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read workspace tool versions
        id: tool-versions
        uses: ./.github/actions/workspace-versions

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.tool-versions.outputs.dotnet_sdk }}

      - name: Download cross-built macOS CLI
        uses: actions/download-artifact@v4
        with:
          name: release-assets-macos
          path: ${{ runner.temp }}/fscript-release

      - name: Unpack macOS CLI
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          unzip -q "${RUNNER_TEMP}/fscript-release/fscript-${GITHUB_REF_NAME}-darwin-unsigned.zip" \
            -d "${RUNNER_TEMP}/fscript-release/unpacked"

      - name: Verify released CLI compilation and automatic FFI configuration
        shell: bash
        run: ./.github/scripts/verify-release-cli.sh "${RUNNER_TEMP}/fscript-release/unpacked/arm64/fscript" "${GITHUB_REF_NAME}"

  create-draft:
    needs: [release-ci, verify-macos-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract release notes from changelog
        shell: bash
        run: ./.github/scripts/extract-release-notes.sh "$GITHUB_REF_NAME" > "${RUNNER_TEMP}/release-notes.md"

      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/release-assets/*.zip
            ${{ runner.temp }}/release-assets/*.nupkg
            ${{ runner.temp }}/release-assets/*.tgz
            ${{ runner.temp }}/release-assets/*.vsix
