name: CI PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  checks: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      suffix: pr
      require-changelog: true
    secrets: inherit
