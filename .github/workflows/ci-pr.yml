name: CI PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce unreleased changelog updates
        env:
          REQUIRE_CHANGELOG_ALWAYS: "true"
        run: .github/scripts/check-unreleased-changelog.sh

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          TERRABUILD_TOKEN: ${{ secrets.TERRABUILD_TOKEN }}
          TERRABUILD_MASTER_KEY: ${{ secrets.TERRABUILD_MASTER_KEY }}

      - name: Build and test with Terrabuild
        run: terrabuild run toolchain build test check

      # Verify independently versioned hosts with isolated temporary artifacts.
      - name: Verify independently versioned SDK provider
        run: terrabuild run toolchain sdk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pr
          path: "**/TestResults/**/*.trx"
          if-no-files-found: warn

      - name: Publish test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v2
        with:
          name: Test Results (PR)
          path: "**/TestResults/**/*.trx"
          reporter: dotnet-trx
