name: CI Branches

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/v')
    uses: ./.github/workflows/ci-trusted.yml
    secrets:
      TERRABUILD_TOKEN: ${{ secrets.TERRABUILD_TOKEN }}
      TERRABUILD_MASTER_KEY: ${{ secrets.TERRABUILD_MASTER_KEY }}
    permissions:
      contents: read
      checks: write
      packages: write
    with:
      suffix: branch
      require-changelog: false

  ci-untrusted:
    if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/v')
    uses: ./.github/workflows/ci.yml
    with:
      suffix: branch
      require-changelog: false
