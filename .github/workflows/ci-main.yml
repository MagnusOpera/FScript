name: CI Branches

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      suffix: branch
      require-changelog: false
      build-runner: ${{ github.repository == 'MagnusOpera/FScript' && github.ref == 'refs/heads/main' && 'ghoulix' || 'ubuntu-latest' }}
    secrets: inherit
