name: Publish test results
description: Publish .NET and Node test summaries from the selected report directory.
inputs:
  suffix:
    description: Names used for GitHub check reports
    required: true
  path:
    description: Root containing TRX and JUnit reports
    default: .out/test-results
runs:
  using: composite
  steps:
    - name: Publish .NET test report
      if: always()
      continue-on-error: true
      uses: magnusopera/test-reporter@main
      with:
        name: .NET Tests (${{ inputs.suffix }})
        path: '${{ inputs.path }}/**/*.trx'
        reporter: dotnet-trx
        fail-on-error: false
        fail-on-empty: false
        use-actions-summary: true
    - name: Publish JavaScript and debugger test report
      if: always()
      continue-on-error: true
      uses: magnusopera/test-reporter@main
      with:
        name: JavaScript and Debugger Tests (${{ inputs.suffix }})
        path: '${{ inputs.path }}/**/*.xml'
        reporter: java-junit
        fail-on-error: false
        fail-on-empty: false
        use-actions-summary: true
