# Build first: dotnet build samples/ffi/Provider/FfiSample.fsproj -c Release
# Select this configuration in VS Code to get Graphics/Math functions and host types.
[runtime]
extern-assemblies = ["Provider/bin/Release/net11.0/FScript.Ffi.Sample.dll"]

# fscript compile main.fss uses these defaults; explicit CLI options override them.
[compile]
backend = "dotnet"
aot = true
size-optimized = true
